name: Build e Deploy no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v3

      - name: Usar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_SHEETS_ID: 1cfe4EKV0ol-0d1CjsvwUKwckj1N52FEYT98hB0ub5sQ
          VITE_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Deploy para GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Mostrar link do site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "🔗 Site publicado em https://bitlabufop.github.io/rankingMostraProfissoes/" >> "$GITHUB_STEP_SUMMARY"
